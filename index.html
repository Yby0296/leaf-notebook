<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="stylesheet" href="styles.css" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body>
  <div class="phone">
    <!-- 顶部常驻栏：日期 / 星期 / 时间 -->
    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="brand-leaf">🍃</span>
        <span class="brand-name">叶子的小本本</span>
      </div>
      <div class="clock" id="clock">
        <span class="clock-date" id="clockDate">----/--/--</span>
        <span class="clock-week" id="clockWeek">星期-</span>
        <span class="clock-time" id="clockTime">--:--</span>
      </div>
    </header>

    <div class="body">
      <!-- 折叠控制条 -->
      <button class="collapse-tab" id="collapseTab" aria-label="折叠/展开导航">
        <svg viewBox="0 0 24 24" width="18" height="18"><path id="collapseArrow" d="M15 6l-6 6 6 6" fill="none" stroke="#7a5c52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- 左侧导航 -->
      <nav class="sidebar" id="sidebar">
        <ul class="nav-list" id="navList">
          <!-- 1 学习任务：认真微笑 -->
          <li class="nav-item" data-nav="learning">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <rect x="10" y="20" width="28" height="8" rx="3" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.6"/>
                <rect x="10" y="29" width="28" height="8" rx="3" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6"/>
                <rect x="12" y="11" width="26" height="9" rx="3" fill="#FFF3F6" stroke="#D98AA0" stroke-width="1.6"/>
                <circle cx="20" cy="15.5" r="1.2" fill="#5C4A42"/><circle cx="26" cy="15.5" r="1.2" fill="#5C4A42"/>
                <path d="M20.5 17.8q2.5 2.2 5 0" stroke="#D98AA0" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                <circle cx="17" cy="16" r="1.5" fill="#F7A8C0" opacity=".75"/><circle cx="29" cy="16" r="1.5" fill="#F7A8C0" opacity=".75"/>
              </svg>
            </span>
            <span class="nav-label">学习任务</span>
          </li>
          <!-- 2 运动：活力大笑 -->
          <li class="nav-item" data-nav="exercise">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <rect x="8" y="20" width="6" height="9" rx="3" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6"/>
                <rect x="34" y="20" width="6" height="9" rx="3" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6"/>
                <rect x="16" y="22" width="16" height="5" rx="2.5" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.6"/>
                <circle cx="21" cy="24.2" r="1.1" fill="#5C4A42"/><circle cx="27" cy="24.2" r="1.1" fill="#5C4A42"/>
                <path d="M21 26.2q3 3 6 0" stroke="#D98AA0" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                <circle cx="18.5" cy="24.8" r="1.8" fill="#F7A8C0" opacity=".8"/><circle cx="29.5" cy="24.8" r="1.8" fill="#F7A8C0" opacity=".8"/>
              </svg>
            </span>
            <span class="nav-label">运动计划</span>
          </li>
          <!-- 3 视频：眨眼酷 -->
          <li class="nav-item" data-nav="video">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <rect x="9" y="16" width="22" height="16" rx="5" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.6"/>
                <path d="M31 21l6-3v12l-6-3z" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="18" cy="23" r="1.8" fill="#5C4A42"/>
                <path d="M23.5 22.2q2 2 4 0" stroke="#5C4A42" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M19.5 26q3 2.4 6 0" stroke="#D98AA0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <circle cx="15" cy="25" r="1.7" fill="#F7A8C0" opacity=".85"/><circle cx="27.5" cy="25" r="1.7" fill="#F7A8C0" opacity=".85"/>
                <circle cx="36" cy="18" r="2.2" fill="#fff" stroke="#D98AA0" stroke-width="1.2"/>
              </svg>
            </span>
            <span class="nav-label">视频剪辑学习</span>
          </li>
          <!-- 4 英语：惊讶开口 A -->
          <li class="nav-item" data-nav="english">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <path d="M10 14h22a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H19l-6 5v-5h-3z" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="17" cy="21" r="1.7" fill="#5C4A42"/><circle cx="25" cy="21" r="1.7" fill="#5C4A42"/>
                <ellipse cx="21" cy="26" rx="1.7" ry="2.1" fill="#D98AA0"/>
                <circle cx="14" cy="23" r="1.6" fill="#F7A8C0" opacity=".7"/><circle cx="28" cy="23" r="1.6" fill="#F7A8C0" opacity=".7"/>
                <text x="37" y="20" font-size="9" font-weight="800" fill="#D98AA0">A</text>
              </svg>
            </span>
            <span class="nav-label">英语口语训练</span>
          </li>
          <!-- 5 账户：满足得意 -->
          <li class="nav-item" data-nav="account">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <ellipse cx="24" cy="26" rx="14" ry="11" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.6"/>
                <circle cx="11" cy="22" r="2.2" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.3"/>
                <circle cx="20" cy="24" r="1.5" fill="#5C4A42"/><circle cx="28" cy="24" r="1.5" fill="#5C4A42"/>
                <path d="M22 28q3 1.6 6 0" stroke="#D98AA0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <circle cx="16" cy="27" r="2.4" fill="#F7A8C0" opacity=".9"/><circle cx="32" cy="27" r="1.6" fill="#F7A8C0" opacity=".8"/>
                <rect x="22" y="13" width="4" height="3" rx="1.5" fill="#D98AA0"/>
                <text x="24" y="33" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">¥</text>
              </svg>
            </span>
            <span class="nav-label">我的账户</span>
          </li>
          <!-- 6 复盘：思考 -->
          <li class="nav-item" data-nav="review">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <rect x="12" y="10" width="24" height="28" rx="5" fill="#FFF3F6" stroke="#D98AA0" stroke-width="1.6"/>
                <path d="M17 10v28" stroke="#D98AA0" stroke-width="1.4"/>
                <circle cx="23" cy="22" r="1.3" fill="#5C4A42"/>
                <path d="M26.5 21q1.6 1.6 3.2 0" stroke="#5C4A42" stroke-width="1.4" fill="none" stroke-linecap="round"/>
                <path d="M23 26q2 1.6 4 0" stroke="#D98AA0" stroke-width="1.1" fill="none" stroke-linecap="round"/>
                <circle cx="20.5" cy="24" r="1.5" fill="#F7A8C0" opacity=".7"/><circle cx="31" cy="24" r="1.5" fill="#F7A8C0" opacity=".7"/>
                <circle cx="35" cy="14" r="2.4" fill="none" stroke="#8FCDE8" stroke-width="1.3"/>
                <path d="M35 11.4v-1.4M36.4 14h1.6" stroke="#8FCDE8" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-label">每日复盘</span>
          </li>
          <!-- 7 预定计划：爱心脸 -->
          <li class="nav-item" data-nav="plans">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <rect x="10" y="14" width="28" height="24" rx="5" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6"/>
                <rect x="10" y="14" width="28" height="7" rx="5" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.6"/>
                <circle cx="17" cy="11.5" r="2" fill="#D98AA0"/><circle cx="31" cy="11.5" r="2" fill="#D98AA0"/>
                <circle cx="21" cy="28" r="1.3" fill="#5C4A42"/><circle cx="27" cy="28" r="1.3" fill="#5C4A42"/>
                <path d="M21.5 30.5q2.5 2 5 0" stroke="#D98AA0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <circle cx="17.5" cy="29.5" r="2.1" fill="#F7A8C0" opacity=".85"/><circle cx="30.5" cy="29.5" r="2.1" fill="#F7A8C0" opacity=".85"/>
                <path d="M14 25c-1.6-2.2-4.6-1-4.6 1.4 0 2.2 4.6 4.4 4.6 4.4s4.6-2.2 4.6-4.4c0-2.4-3-3.6-4.6-1.4z" fill="#F7A8C0" stroke="#D98AA0" stroke-width=".9"/>
              </svg>
            </span>
            <span class="nav-label">预定计划</span>
          </li>
          <!-- 8 每日任务：加油打气 -->
          <li class="nav-item" data-nav="daily">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="30" height="30">
                <rect x="11" y="12" width="26" height="26" rx="5" fill="#8FCDE8" stroke="#6BA9CC" stroke-width="1.6"/>
                <rect x="17" y="9" width="14" height="6" rx="3" fill="#F7A8C0" stroke="#D98AA0" stroke-width="1.6"/>
                <circle cx="21" cy="24" r="1.5" fill="#5C4A42"/><circle cx="27" cy="24" r="1.5" fill="#5C4A42"/>
                <path d="M20.5 26.5q3 3 5 0" stroke="#D98AA0" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                <circle cx="17.5" cy="26" r="1.8" fill="#F7A8C0" opacity=".85"/><circle cx="30.5" cy="26" r="1.8" fill="#F7A8C0" opacity=".85"/>
                <path d="M16 32l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M33 14l.8 1.7 1.9.2-1.4 1.3.4 1.9-1.7-.9-1.7.9.4-1.9L31.3 16l1.9-.2z" fill="#F7A8C0" stroke="#D98AA0" stroke-width=".7"/>
              </svg>
            </span>
            <span class="nav-label">每日任务</span>
          </li>
        </ul>

        <!-- 全局记录模式切换 -->
        <div class="mode-switch" id="modeSwitch">
          <div class="mode-title">记录模式</div>
          <div class="mode-toggle">
            <button class="mode-opt" data-mode="daily">每日重置</button>
            <button class="mode-opt" data-mode="cumulative">累计记录</button>
          </div>
        </div>
      </nav>

      <!-- 右侧内容区 -->
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
