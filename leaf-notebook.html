<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7A8C0" />
  <title>叶子的小本本</title>
  <style>
/* ============ 叶子的小本本 · 马卡龙柔雾视觉系统 ============ */
:root{
  --pink:        #F7A8C0;   /* 可爱粉 */
  --pink-deep:   #F18FA8;
  --pink-line:   #D98AA0;
  --pink-soft:   #FCE4EC;   /* 浅粉底 */
  --blue:        #8FCDE8;   /* 可爱蓝 */
  --blue-deep:   #5FB0D8;
  --blue-line:   #6BA9CC;
  --blue-soft:   #E6F3FB;   /* 浅蓝底 */
  --cream:       #FBF7F2;   /* 米白色背景 */
  --cream-card:  #FFFFFF;
  --gray-line:   #ECE6DE;   /* 浅灰分割线 */
  --ink:         #6B554C;   /* 深灰棕色文字 */
  --ink-soft:    #9A8678;
  --grad:        var(--pink);
  --grad-soft:   var(--pink-soft);
  --shadow:      0 6px 18px rgba(150,120,110,.12);
  --shadow-sm:   0 3px 10px rgba(150,120,110,.10);
  --radius:      18px;
  --radius-sm:   12px;
  font-size: 15px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Comic Sans MS",-apple-system,sans-serif;
  background: #FCEFF4;
  color:var(--ink);
  display:flex; justify-content:center;
}

/* 手机外框（桌面预览时居中像一台手机） */
.phone{
  width:100%; max-width:440px; height:100vh; min-height:100vh;
  background:var(--cream);
  display:flex; flex-direction:column;
  box-shadow:0 0 40px rgba(150,120,110,.18);
  position:relative; overflow:hidden;
}

/* ===== 顶部常驻栏 ===== */
.topbar{
  flex:0 0 auto; height:58px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 14px;
  background:var(--grad-soft);
  border-bottom:1px solid var(--gray-line);
  position:relative; z-index:30;
}
.brand{ display:flex; align-items:center; gap:6px; }
.brand-leaf{ font-size:18px; }
.brand-name{ font-weight:800; font-size:15px; letter-spacing:.5px; color:var(--ink); }
.clock{ display:flex; align-items:baseline; gap:8px; }
.clock-date{ font-size:12px; color:var(--ink-soft); }
.clock-week{ font-size:12px; color:var(--ink-soft); }
.clock-time{
  font-size:19px; font-weight:800; color:var(--ink);
  font-variant-numeric:tabular-nums;
  background:#fff; padding:2px 9px; border-radius:20px;
  box-shadow:var(--shadow-sm);
}

/* ===== 主体双栏 ===== */
.body{ flex:1 1 auto; display:flex; min-height:0; position:relative; }

/* 折叠控制条 */
.collapse-tab{
  position:absolute; top:50%; left:33.5%; transform:translate(-50%,-50%);
  z-index:25; width:24px; height:44px; border:none; cursor:pointer;
  background:var(--pink); border-radius:0 14px 14px 0;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-sm); transition:left .28s ease;
}
.collapse-tab svg{ transition:transform .28s ease; }
.collapse-tab:active{ transform:translate(-50%,-50%) scale(.92); }

/* 左侧导航 1/3 */
.sidebar{
  width:33.5%; flex:0 0 33.5%;
  background:linear-gradient(180deg,#FFF6F2 0%, #F4F8FB 100%);
  border-right:1px solid var(--gray-line);
  display:flex; flex-direction:column;
  padding:10px 6px 8px;
  transition:margin-left .28s ease, opacity .2s ease;
}

/* 收起状态：侧栏移出视口，仅保留图标露在边缘，内容区占满 */
.body.collapsed .sidebar{ margin-left:-33.5%; opacity:0; pointer-events:none; }
.body.collapsed .collapse-tab{ left:0; }
.body.collapsed .collapse-tab #collapseArrow{ transform:rotate(180deg); }
.nav-list{ list-style:none; margin:0; padding:0; flex:1 1 auto; display:flex; flex-direction:column; gap:6px; }
.nav-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:9px 2px; border-radius:16px;
  cursor:pointer; transition:.18s; text-align:center;
  border:1px solid transparent;
}
.nav-item:active{ transform:scale(.96); }
.nav-ico{
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:#fff; box-shadow:var(--shadow-sm);
}
.nav-label{ font-size:11px; font-weight:700; color:var(--ink-soft); line-height:1.2; }
.nav-item.active{
  background:var(--grad);
  border-color:rgba(255,255,255,.8);
  box-shadow:var(--shadow-sm);
}
.nav-item.active .nav-label{ color:#7a5c52; }
.nav-item.active .nav-ico{ background:#fff; }

/* 模式切换 */
.mode-switch{ margin-top:8px; padding:8px 4px 2px; border-top:1px dashed var(--gray-line); }
.mode-title{ font-size:10px; color:var(--ink-soft); text-align:center; margin-bottom:5px; }
.mode-toggle{ display:flex; background:#fff; border-radius:20px; padding:3px; box-shadow:var(--shadow-sm); }
.mode-opt{
  flex:1; border:none; background:transparent; cursor:pointer;
  font-size:10.5px; font-weight:700; color:var(--ink-soft);
  padding:6px 2px; border-radius:16px; transition:.18s; font-family:inherit;
}
.mode-opt.active{ background:var(--grad); color:#7a5c52; }

/* ===== 右侧内容区 ===== */
.content{
  flex:1 1 auto; min-width:0;
  padding:14px 14px 28px;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--cream);
}
.module-title{ font-size:18px; font-weight:800; margin:2px 0 4px; }
.module-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 14px; }

/* 卡片 */
.card{
  background:var(--cream-card); border-radius:var(--radius);
  padding:14px; margin-bottom:14px; box-shadow:var(--shadow);
  border:1px solid var(--gray-line);
}
.card-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.card-h .t{ font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px; }
.card-h .t .dot{ width:10px; height:10px; border-radius:50%; }
.dot-pink{ background:var(--pink-deep); }
.dot-blue{ background:var(--blue-deep); }

/* 进度 / 统计条 */
.rate-pill{
  font-size:11px; font-weight:800; color:#fff;
  background:var(--grad); padding:3px 10px; border-radius:20px;
}
.progress{ height:9px; background:#F1ECE6; border-radius:20px; overflow:hidden; margin:8px 0; }
.progress > i{ display:block; height:100%; background:var(--grad); border-radius:20px; transition:.4s; }
.stat-row{ display:flex; gap:8px; flex-wrap:wrap; }
.stat-chip{
  flex:1 1 30%; min-width:78px; background:var(--grad-soft);
  border-radius:14px; padding:9px 8px; text-align:center;
}
.stat-chip .n{ font-size:17px; font-weight:800; color:var(--ink); }
.stat-chip .l{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

/* 任务条目 */
.item{
  display:flex; align-items:center; gap:9px;
  padding:10px 11px; border-radius:14px;
  background:#FCF9F5; border:1px solid var(--gray-line);
  margin-bottom:8px; transition:.15s;
}
.item:active{ transform:scale(.99); }
.item .check{
  width:22px; height:22px; flex:0 0 22px; border-radius:7px;
  border:2px solid var(--blue-line); background:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:.15s;
}
.item.done .check{ background:var(--grad); border-color:transparent; }
.item .check svg{ width:13px; height:13px; opacity:0; transition:.15s; }
.item.done .check svg{ opacity:1; }
.item .body{ flex:1 1 auto; min-width:0; }
.item .name{ font-weight:700; font-size:14px; word-break:break-word; }
.item.done .name{ text-decoration:line-through; color:var(--ink-soft); }
.item .meta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.item.done .meta{ text-decoration:line-through; opacity:.7; }
.item .ops{ display:flex; gap:6px; flex:0 0 auto; }
.icon-btn{
  border:none; background:#F4EEE8; color:var(--ink-soft);
  width:28px; height:28px; border-radius:9px; cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.icon-btn:active{ transform:scale(.9); }
.icon-btn.danger{ background:#FBE3E6; color:#C96A78; }

/* 添加表单 */
.add-form{ display:flex; gap:7px; flex-wrap:wrap; margin-top:6px; }
.add-form input, .add-form select, .add-form textarea{
  font-family:inherit; font-size:13px; color:var(--ink);
  border:1.5px solid var(--gray-line); border-radius:12px;
  padding:9px 11px; background:#fff; outline:none; transition:.15s;
}
.add-form input:focus, .add-form select:focus, .add-form textarea:focus{
  border-color:var(--blue-deep); box-shadow:0 0 0 3px rgba(159,207,227,.25);
}
.add-form .f-name{ flex:1 1 100%; }
.add-form .f-num{ flex:1 1 40%; }
.add-form .f-sel{ flex:1 1 40%; }
.btn{
  border:none; cursor:pointer; font-family:inherit; font-weight:800;
  border-radius:14px; padding:10px 16px; font-size:13px; transition:.15s;
  background:var(--grad); color:#7a5c52; box-shadow:var(--shadow-sm);
}
.btn:active{ transform:scale(.96); }
.btn.ghost{ background:#fff; color:var(--ink-soft); border:1.5px solid var(--gray-line); box-shadow:none; }
.btn.block{ width:100%; }

/* 标签筛选 */
.tags{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
.tag{
  font-size:12px; font-weight:700; padding:6px 13px; border-radius:20px;
  background:#fff; color:var(--ink-soft); border:1.5px solid var(--gray-line); cursor:pointer; transition:.15s;
}
.tag.active{ background:var(--blue-deep); color:#fff; border-color:transparent; }

/* 视频卡片 */
.video-card{
  display:flex; gap:11px; background:#FCF9F5; border:1px solid var(--gray-line);
  border-radius:14px; padding:10px; margin-bottom:10px; align-items:stretch;
}
.thumb{
  width:84px; flex:0 0 84px; border-radius:11px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px;
}
.thumb .play{ position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.35); border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:10px; }
.video-card .v-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.video-card .v-title{ font-weight:800; font-size:13.5px; line-height:1.3; }
.video-card .v-tag{ font-size:10.5px; color:var(--blue-line); margin-top:3px; }
.video-card .v-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
.heat{ font-size:11px; color:var(--ink-soft); }
.learn-badge{
  font-size:11px; font-weight:800; color:#7a5c52; background:var(--grad);
  padding:4px 10px; border-radius:20px; cursor:pointer; border:none;
}
.learn-badge.on{ background:#E7DEDD; color:var(--ink-soft); }

/* 口语 */
.dialogue{ background:var(--blue-soft); border-radius:14px; padding:12px; margin-bottom:12px; }
.dialogue .scene{ font-size:11px; font-weight:800; color:var(--blue-line); margin-bottom:6px; }
.line{ display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px dashed var(--gray-line); }
.line:last-child{ border-bottom:none; }
.line .line-txt{ flex:1 1 auto; min-width:0; }
.line .en{ font-weight:700; font-size:14px; }
.line .cn{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.line-play{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
  background:#fff; box-shadow:var(--shadow-sm); font-size:14px; display:flex; align-items:center; justify-content:center;
  transition:.15s;
}
.line-play:active{ transform:scale(.9); }
.line-play.speaking{ background:var(--pink); }

/* 朗读录音区 */
.rec-bar{ display:flex; align-items:center; gap:10px; margin:6px 0 12px; }
.rec-btn{
  flex:1; border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;
  border-radius:14px; padding:12px 16px; transition:.15s; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--grad); color:#7a5c52; box-shadow:var(--shadow-sm);
}
.rec-btn:active{ transform:scale(.97); }
.rec-btn.recording{ background:var(--pink-deep); color:#fff; }
.rec-btn:disabled{ opacity:.55; }
.rec-dot{ width:10px; height:10px; border-radius:50%; background:currentColor; }
.rec-btn.recording .rec-dot{ animation:blink 1s infinite; }
@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }

.rec-result{ background:#fff; border:1.5px solid var(--gray-line); border-radius:14px; padding:11px 12px; margin-bottom:12px; font-size:13px; }
.rec-result .rr-h{ font-size:11px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
.rec-result .rr-you{ font-weight:700; }
.rec-result .rr-you .ok{ color:#3a9d6b; } .rec-result .rr-you .miss{ color:#C96A78; text-decoration:line-through; opacity:.7; }
.rec-result .rr-you .extra{ color:var(--blue-line); }
.rec-result .rr-target{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
.rec-hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:12px; }
.rec-unsupported{ background:#FFF4E9; border:1px dashed #E8B98C; color:#B07A3C; border-radius:12px; padding:9px 11px; font-size:12px; margin-bottom:12px; }
.vocab{ background:#fff; border-radius:12px; padding:10px 12px; margin-top:8px; font-size:12px; }
.vocab b{ color:var(--pink-line); }
.scores{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.score-box{ flex:1 1 28%; min-width:80px; background:#fff; border:1.5px solid var(--gray-line); border-radius:14px; padding:9px; text-align:center; }
.score-box .sl{ font-size:11px; color:var(--ink-soft); }
.score-box input{ width:54px; text-align:center; font-size:18px; font-weight:800; border:none; border-bottom:2px dashed var(--blue-line); background:transparent; color:var(--ink); outline:none; }

/* 账户 */
.amount-big{ font-size:26px; font-weight:800; color:var(--ink); }
.amount-big small{ font-size:14px; font-weight:700; }
.seg{ display:flex; gap:6px; margin:8px 0 12px; flex-wrap:wrap; }
.seg button{
  flex:1 1 auto; min-width:54px; border:1.5px solid var(--gray-line); background:#fff;
  border-radius:12px; padding:8px 4px; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:inherit; transition:.15s;
}
.seg button.active{ background:var(--grad); color:#7a5c52; border-color:transparent; }
.cat-pick{ display:flex; gap:6px; flex-wrap:wrap; }
.cat{
  flex:1 1 22%; min-width:62px; text-align:center; padding:9px 4px; border-radius:12px;
  border:1.5px solid var(--gray-line); background:#fff; cursor:pointer; font-size:12px; font-weight:700; color:var(--ink-soft); transition:.15s;
}
.cat.active{ color:#7a5c52; border-color:transparent; }
.cat.c1.active{ background:#FADADD; } .cat.c2.active{ background:#CDE7F0; }
.cat.c3.active{ background:#FCEFD6; } .cat.c4.active{ background:#DDEFD8; }
.donut-wrap{ display:flex; align-items:center; gap:14px; margin-top:8px; }
.donut{ width:96px; height:96px; border-radius:50%; flex:0 0 96px; position:relative; }
.donut::after{ content:""; position:absolute; inset:22px; background:#fff; border-radius:50%; }
.legend{ flex:1 1 auto; display:flex; flex-direction:column; gap:5px; font-size:12px; }
.legend .lg{ display:flex; align-items:center; gap:6px; }
.legend .sw{ width:11px; height:11px; border-radius:4px; }
.legend .lv{ margin-left:auto; font-weight:800; color:var(--ink); }

/* 复盘 */
.mood-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.mood{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 6px; border-radius:14px; border:1.5px solid var(--gray-line);
  background:#fff; cursor:pointer; width:60px; transition:.15s; font-size:11px; color:var(--ink-soft);
}
.mood .em{ font-size:22px; }
.mood.active{ background:var(--grad); color:#7a5c52; border-color:transparent; }
.sync-list .item{ background:#FCF9F5; }
.history-day{ font-size:12px; font-weight:800; color:var(--ink-soft); margin:12px 0 6px; }
textarea.note{ width:100%; min-height:74px; resize:vertical; }

/* 空状态 */
.empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:22px 10px; }
.empty .em{ font-size:30px; display:block; margin-bottom:6px; }

/* 历史面板（抽屉式折叠） */
.history-panel{ display:none; margin-top:6px; }
.history-panel.open{ display:block; }

/* 全局今日提醒横幅 */
.reminder-banner{
  background:var(--pink); color:#fff; border-radius:16px;
  padding:11px 14px; margin-bottom:14px; font-weight:800; font-size:13.5px;
  box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:6px;
  animation:pop .3s ease;
}
.reminder-banner .bell{ font-size:17px; }
@keyframes pop{ from{ transform:scale(.96); opacity:.6 } to{ transform:scale(1); opacity:1 } }
.link-btn{ background:none; border:none; color:var(--blue-line); font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit; padding:4px 0; }

/* 提示气泡 */
.toast{
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(10px);
  background:rgba(107,85,76,.92); color:#fff; padding:9px 18px; border-radius:20px;
  font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:99;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* 滚动条美化 */
.content::-webkit-scrollbar{ width:6px; }
.content::-webkit-scrollbar-thumb{ background:#E2D8CE; border-radius:6px; }

/* 小屏自适应：导航标签更紧凑 */
@media (max-width:360px){
  .nav-label{ font-size:10px; }
  .nav-ico{ width:38px; height:38px; }
  .clock-date{ display:none; }
}

</style>

  /* ---------------- 存储 ---------------- */
  let data = null;
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        data = JSON.parse(raw);
        data = deepMerge(defaultData(), data);
      } else data = defaultData();
    } catch (e) { data = defaultData(); }
    rolloverCheck();
    save();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  function rolloverCheck() {
    const t = todayKey();
    if (data.settings.lastVisit !== t) {
      if (data.settings.mode === "daily") {
        // 新的一天：当日数据已在 days 中按日期归档，无需额外操作
        setTimeout(() => toast("🌿 新的一天，当日任务已重置~"), 600);
      }
      data.settings.lastVisit = t;
    }
  }
  function deepMerge(base, over) {
    if (Array.isArray(base)) return Array.isArray(over) ? over : base;
    if (base && typeof base === "object") {
      const out = {};
      for (const k in base) out[k] = (over && k in over) ? deepMerge(base[k], over[k]) : base[k];
      return out;
    }
    return over === undefined ? base : over;
  }

  /* ---------------- 工具 ---------------- */
  function uid() { return "id" + Math.random().toString(36).slice(2, 9); }
  function $(s, r) { return (r || document).querySelector(s); }
  function ymd(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function todayKey(d) { return ymd(d || new Date()); }
  function parseKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
  function weekdayCn(d) { return "星期" + ["日", "一", "二", "三", "四", "五", "六"][d.getDay()]; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function monthKeyList(y, m) { const n = daysInMonth(y, m); const a = []; for (let i = 1; i <= n; i++) a.push(`${y}-${String(m).padStart(2, "0")}-${String(i).padStart(2, "0")}`); return a; }
  function weekKeyList(ref) { const a = []; for (let i = 6; i >= 0; i--) a.push(todayKey(addDays(ref || new Date(), -i))); return a; }
  function dateDiff(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function money(n) { return (Math.round(n * 100) / 100).toLocaleString("zh-CN"); }
  function hash(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }

  // 学习任务

    if (data.settings.mode === "daily") return (data.learning.days[todayKey()]?.[sub] || []).includes(id);
    return !!data.learning.templates[sub].find(t => t.id === id)?.done;
  }
  function toggleLearn(sub, id) {
    const tpl = data.learning.templates[sub].find(t => t.id === id);
    if (!tpl) return;
    if (data.settings.mode === "daily") {
      const arr = ensureDay("learning")[sub];
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
    } else {
      tpl.done = !tpl.done;
      const arr = ensureDay("learning")[sub];
      const i = arr.indexOf(id);
      if (tpl.done && i < 0) arr.push(id);
      else if (!tpl.done && i >= 0) arr.splice(i, 1);

  function exerDone(id) {

  function monthStats(kind, sub) {
    const d = new Date(); const y = d.getFullYear(), m = d.getMonth() + 1;
    const keys = monthKeyList(y, m);
    let dayCount = 0, mins = 0;
    keys.forEach(k => {
      if (kind === "learning") {
        const rec = data.learning.days[k];
        if (!rec) return;
        const ids = (rec[sub] || []);
        if (ids.length) {
          dayCount++;
          ids.forEach(id => { const tp = data.learning.templates[sub].find(t => t.id === id); if (tp) mins += tp.est || 0; });
        }
      } else {
        const rec = data.exercise.days[k];
        if (!rec || !rec.length) return;
        dayCount++;
        rec.forEach(id => { const tp = data.exercise.templates.find(t => t.id === id); if (tp) mins += tp.target || 0; });
      }
    });
    if (kind === "learning" && data.settings.mode === "cumulative") {
      const tp = data.learning.templates[sub].filter(t => t.done);
      mins = tp.reduce((s, x) => s + (x.est || 0), 0);

    return { days: dayCount, mins };

  /* 英语发音播放 / 录音识别 / 评分 */
  function speakText(text) {
    try {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.95; u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function speakAll(lines) {
    if (!window.speechSynthesis) { toast("当前浏览器不支持语音播放"); return; }
    window.speechSynthesis.cancel();
    let i = 0;
    const next = () => {
      if (i >= lines.length) return;
      const u = new SpeechSynthesisUtterance(lines[i].en);
      u.lang = "en-US"; u.rate = 0.95; u.pitch = 1;
      u.onend = () => { i++; setTimeout(next, 350); };
      window.speechSynthesis.speak(u);
    };
    next();
  }
  function cleanWord(w) { return w.toLowerCase().replace(/[^a-z']/g, ""); }
  function scoreReading(target, user, confs) {
    const tw = target.toLowerCase().split(/\s+/).filter(Boolean).map(cleanWord);
    const uw = user.toLowerCase().split(/\s+/).filter(Boolean).map(cleanWord);
    const uwSet = new Set(uw);
    const matched = tw.filter(w => uwSet.has(w)).length;
    const cmp = tw.length ? Math.round(matched / tw.length * 100) : 0;
    const acc = uw.length ? Math.round(matched / uw.length * 100) : 0;
    const avgConf = (confs && confs.length) ? confs.reduce((a, b) => a + b, 0) / confs.length : (acc / 100);
    const fl = Math.round(Math.max(0, Math.min(1, avgConf)) * 100);
    return { acc, fl, cmp };
  }
  function diffWords(target, user) {
    const tw = target.toLowerCase().split(/\s+/).filter(Boolean);
    const uwSet = new Set(user.toLowerCase().split(/\s+/).filter(Boolean).map(cleanWord));
    return tw.map(w => {
      const c = cleanWord(w);
      return uwSet.has(c) ? `<span class="ok">${esc(w)}</span>` : `<span class="miss">${esc(w)}</span>`;
    }).join(" ");
  }
  function diffUser(user, target) {
    const twSet = new Set(target.toLowerCase().split(/\s+/).filter(Boolean).map(cleanWord));
    const arr = user.toLowerCase().split(/\s+/).filter(Boolean);
    if (!arr.length) return '<span class="extra">（未识别到内容）</span>';
    return arr.map(w => {
      const c = cleanWord(w);
      return twSet.has(c) ? `<span class="ok">${esc(w)}</span>` : `<span class="extra">${esc(w)}</span>`;
    }).join(" ");
  }
  function startEnglishRecord() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast("当前浏览器不支持语音识别"); return; }
    const t = todayKey();
    const lib = ENGLISH_LIB[hash(t) % ENGLISH_LIB.length];
    const target = lib.lines.map(l => l.en).join(" ");
    let recog;
    try { recog = new SR(); } catch (e) { toast("无法启动语音识别"); return; }
    recog.lang = "en-US"; recog.interimResults = true; recog.continuous = false; recog.maxAlternatives = 1;
    let finalTranscript = "", confs = [];
    const btn = $("#recBtn"), label = $("#recLabel");
    if (btn) { btn.classList.add("recording"); btn.disabled = true; }
    if (label) label.textContent = "🎙️ 正在聆听…请朗读";
    recog.onresult = (ev) => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i][0];
        if (r.confidence) confs.push(r.confidence);
        if (ev.results[i].isFinal) finalTranscript += r.transcript; else interim += r.transcript;
      }
      if (label) {
        const shown = (finalTranscript || interim).trim();
        label.textContent = shown ? "“" + shown.slice(0, 24) + (shown.length > 24 ? "…" : "") + "”" : "🎙️ 正在聆听…请朗读";
      }
    };
    recog.onerror = (ev) => { toast("语音识别：" + (ev.error || "出错")); };
    recog.onend = () => {
      if (btn) { btn.classList.remove("recording"); btn.disabled = false; }
      if (label) label.textContent = "🎤 开始朗读跟读";
      const you = finalTranscript.trim();
      if (!you) { toast("没听清，再试一次~"); render(); return; }
      const sc = scoreReading(target, you, confs);
      data.english.lastScore = { acc: sc.acc, fl: sc.fl, cmp: sc.cmp };
      data.english.days[t] = { acc: sc.acc, fl: sc.fl, cmp: sc.cmp, you, done: true };
      save(); render(); toast("💬 跟读完成，看看得分~");
    };
    try { recog.start(); }
    catch (e) {
      toast("无法启动，请检查麦克风权限");
      if (btn) { btn.classList.remove("recording"); btn.disabled = false; }
      if (label) label.textContent = "🎤 开始朗读跟读";
    }
  }

    const nav = e.target.closest(".nav-item");
    if (nav) { UI.module = nav.dataset.nav; UI.reviewView = null; render(); return; }

    if (mode) { data.settings.mode = mode.dataset.mode; save(); render(); toast(mode.dataset.mode === "daily" ? "已切换：每日重置" : "已切换：累计记录"); return; }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    try { handleAction(a, el); } catch (err) { console.error(err); }
  });

  function handleAction(a, el) {
    switch (a) {
      /* 学习任务 */
      case "add-learning": {
        const sub = el.dataset.sub; const name = $("#ln_" + sub).value.trim();
        const est = num($("#le_" + sub).value);
        if (!name) { toast("先写点任务说明吧~"); return; }
        data.learning.templates[sub].push({ id: uid(), name, est, done: false });
        save(); render(); break;
      }
      case "toggle-learning": toggleLearn(el.dataset.sub, el.dataset.id); break;
      case "del-learning": {
        const sub = el.dataset.sub; const id = el.dataset.id;
        data.learning.templates[sub] = data.learning.templates[sub].filter(t => t.id !== id);
        // 清理历史
        Object.values(data.learning.days).forEach(r => { if (r[sub]) r[sub] = r[sub].filter(x => x !== id); });
        save(); render(); break;
      }
      case "edit-learning": {
        const sub = el.dataset.sub; const id = el.dataset.id;
        const tp = data.learning.templates[sub].find(t => t.id === id); if (!tp) return;
        const name = prompt("修改任务说明", tp.name); if (name === null) return;
        const est = prompt("修改预计时长(分钟)", tp.est); if (est === null) return;
        tp.name = name.trim() || tp.name; tp.est = num(est); save(); render(); break;
      }
      case "hist-learning": UI.learnHist = !UI.learnHist; render(); break;

      /* 运动 */
      case "add-exercise": {
        const name = $("#ex_name").value.trim(); const target = num($("#ex_target").value); const count = Math.max(1, num($("#ex_count").value) || 1);
        if (!name) { toast("先填运动项目~"); return; }
        data.exercise.templates.push({ id: uid(), name, target, count, done: false }); save(); render(); break;
      }
      case "toggle-exercise": toggleExer(el.dataset.id); break;
      case "del-exercise": {
        const id = el.dataset.id; data.exercise.templates = data.exercise.templates.filter(t => t.id !== id);
        Object.keys(data.exercise.days).forEach(k => { data.exercise.days[k] = (data.exercise.days[k] || []).filter(x => x !== id); }); save(); render(); break;
      }
      case "edit-exercise": {
        const id = el.dataset.id; const tp = data.exercise.templates.find(t => t.id === id); if (!tp) return;
        const name = prompt("修改运动项目", tp.name); if (name === null) return;
        const target = prompt("修改目标时长(分钟)", tp.target); if (target === null) return;
        const count = prompt("修改组数", tp.count); if (count === null) return;
        tp.name = name.trim() || tp.name; tp.target = num(target); tp.count = Math.max(1, num(count) || 1); save(); render(); break;
      }
      case "hist-exercise": UI.exerHist = !UI.exerHist; render(); break;

      /* 视频 */
      case "video-tag": UI.videoFilter = el.dataset.tag; render(); break;
      case "toggle-video": {
        const id = el.dataset.id; const t = todayKey();
        if (data.video.learned[id]) delete data.video.learned[id];
        else data.video.learned[id] = t;
        save(); render(); break;
      }

      /* 英语 */
      case "speak-en": {
        const lib = ENGLISH_LIB[hash(todayKey()) % ENGLISH_LIB.length];
        const line = lib.lines[+el.dataset.i];
        el.classList.add("speaking");
        setTimeout(() => el.classList.remove("speaking"), 1300);
        speakText(line.en); break;
      }
      case "speak-all": {
        const lib = ENGLISH_LIB[hash(todayKey()) % ENGLISH_LIB.length];
        speakAll(lib.lines); break;
      }
      case "rec-en": startEnglishRecord(); break;
      case "save-english": {
        const t = todayKey(); const acc = num($("#sc_acc").value), fl = num($("#sc_fl").value), cmp = num($("#sc_cmp").value);
        data.english.lastScore = { acc, fl, cmp };
        data.english.days[t] = { acc, fl, cmp, done: true };
        save(); render(); toast("💬 今日口语已打卡！"); break;
      }

      /* 账户 - 存款 */
      case "add-deposit": {
        const amt = num($("#dep_amt").value); if (!amt) { toast("请输入金额~"); return; }
        const note = $("#dep_note").value.trim();
        data.account.deposits.push({ id: uid(), amount: amt, date: todayKey(), note }); save(); render(); break;
      }
      case "del-deposit": data.account.deposits = data.account.deposits.filter(x => x.id !== el.dataset.id); save(); render(); break;

      /* 账户 - 开支 */
      case "pick-cat": {
        const cat = el.dataset.cat;
        if (!window._expCat || window._expCat !== cat) window._expCat = cat; else window._expCat = cat;
        // 仅高亮，提交时读取
        document.querySelectorAll(".cat[data-action='pick-cat']").forEach(c => c.classList.toggle("active", c.dataset.cat === cat));
        break;
      }
      case "add-expense": {
        const amt = num($("#exp_amt").value); if (!amt) { toast("请输入金额~"); return; }
        const note = $("#exp_note").value.trim();
        const cat = window._expCat || EXPENSE_CATS[0].key;
        const t = todayKey();
        if (!data.account.expenses[t]) data.account.expenses[t] = [];
        data.account.expenses[t].push({ id: uid(), cat, amount: amt, note });
        window._expCat = null; save(); render(); break;
      }
      case "acc-range": UI.accRange = el.dataset.range; render(); break;
      case "acc-cat": UI.accCat = el.dataset.cat; render(); break;

      /* 复盘 */
      case "mood": {
        const t = todayKey(); const m = el.dataset.mood;
        if (!data.review.days[t]) data.review.days[t] = { emotions: [], emotionNote: "", summary: "", tomorrow: "" };
        const arr = data.review.days[t].emotions; const i = arr.indexOf(m);
        if (i >= 0) arr.splice(i, 1); else arr.push(m); save(); render(); break;
      }
      case "save-review": {
        const t = todayKey();
        if (!data.review.days[t]) data.review.days[t] = { emotions: [], emotionNote: "", summary: "", tomorrow: "" };
        const r = data.review.days[t];
        r.emotionNote = $("#rv_emotion").value; r.summary = $("#rv_summary").value; r.tomorrow = $("#rv_tomorrow").value;
        save(); toast("💾 今日复盘已保存~"); break;
      }
      case "hist-review": UI.reviewView = "__list"; renderReviewList(); break;
      case "back-review": UI.reviewView = null; render(); break;

      /* 预定计划 */
      case "add-plan": {
        const title = $("#pl_title").value.trim();
        const date = $("#pl_date").value;
        const time = $("#pl_time").value;
        const note = $("#pl_note").value.trim();
        if (!title || !date) { toast("请填写内容并选择日期~"); return; }
        data.plans.items.push({ id: uid(), title, date, time, note, done: false });
        save(); render();
        toast(date === todayKey() ? "🔔 已加入今日提醒" : "📅 已预定 " + date + (time ? " " + time : "") + " 的计划"); break;
      }
      case "toggle-plan": {
        const p = data.plans.items.find(x => x.id === el.dataset.id); if (!p) return;
        p.done = !p.done; save(); render(); break;
      }
      case "del-plan": data.plans.items = data.plans.items.filter(x => x.id !== el.dataset.id); save(); render(); break;
      case "edit-plan": {
        const p = data.plans.items.find(x => x.id === el.dataset.id); if (!p) return;
        const title = prompt("修改计划内容", p.title); if (title === null) return;
        const date = prompt("修改日期 (YYYY-MM-DD)", p.date); if (date === null) return;
        const time = prompt("修改时间 (HH:MM，可留空)", p.time || ""); if (time === null) return;
        const note = prompt("修改备注", p.note || ""); if (note === null) return;
        p.title = title.trim() || p.title; p.date = date.trim() || p.date; p.time = time.trim(); p.note = note; save(); render(); break;
      }
    }
  }

  function renderReviewList() {
    const dates = Object.keys(data.review.days).sort((a, b) => b.localeCompare(a));
    if (!dates.length) return `<div class="module-title">📝 历史复盘</div><div class="empty"><span class="em">📭</span>还没有历史复盘<br><button class="link-btn" data-action="back-review">← 返回</button></div>`;
    const items = dates.map(d => { const r = data.review.days[d]; const moods = (r.emotions || []).map(m => { const map = { "开心": "😊", "平静": "😌", "疲惫": "😪", "焦虑": "😰", "满足": "😍", "emo": "😢" }; return map[m] || "🙂"; }).join(""); return `<div class="item" data-action="open-review" data-date="${d}" style="cursor:pointer"><div class="body"><div class="name">${d}　${weekdayCn(parseKey(d))}</div><div class="meta">${moods || "未记录情绪"}</div></div><div class="ops">›</div></div>`; }).join("");
    return `<div class="module-title">📝 历史复盘</div><div class="module-sub">按日期归档，点击查看</div>${items}<button class="link-btn" data-action="back-review" style="margin-top:8px">← 返回今日复盘</button>`;
  }

  // 处理历史列表中的打开
  document.addEventListener("click", (e) => {
    const open = e.target.closest("[data-action='open-review']");
    if (open) { UI.reviewView = open.dataset.date; render(); }
  });
  // 自定义日期范围变更
  document.addEventListener("change", (e) => {
    if (e.target.id === "acc_start") { UI.accStart = e.target.value; render(); }
    if (e.target.id === "acc_end") { UI.accEnd = e.target.value; render(); }
  });

  /* ===================================================================
     顶部时钟
     =================================================================== */
  function tick() {
    const d = new Date();
    $("#clockDate").textContent = ymd(d).replace(/-/g, "/");
    $("#clockWeek").textContent = weekdayCn(d);
    $("#clockTime").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ===================================================================
     启动
     =================================================================== */
  load();
  tick(); setInterval(tick, 1000);
  // 恢复侧边栏折叠状态
  try { if (localStorage.getItem("yezi_sidebar") === "1") $(".body").classList.add("collapsed"); } catch (e) {}
  render();
  // 当日有预定计划未完成 -> 自动提醒
  const dueNow = (data.plans.items || []).filter(p => p.date === todayKey() && !p.done);
  if (dueNow.length) setTimeout(() => toast("🔔 今天有 " + dueNow.length + " 件预定计划，记得完成哦~"), 700);

  // 暴露给调试
  window.__yezi = { data, save, render };
})();

</script>
</body>
</html>
